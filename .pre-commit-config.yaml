repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-yaml
    -   id: check-xml
    -   id: end-of-file-fixer
        exclude: ^(src/uic/|wiki/screenshots/|src/translations/|src/includes/|src/test/data/|src/test/sanity/data/)
    -   id: trailing-whitespace
        exclude: ^(src/uic/|src/translations/|src/includes/|src/test/data/|src/test/sanity/data/)
    -   id: double-quote-string-fixer
        exclude: ^(src/uic/|src/translations/|src/includes/|src/test/data/|src/test/sanity/data/)
    -   id: check-ast
-   repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
        args: [--py312-plus]
        exclude: ^(src/uic/|src/translations/|src/includes/)
-   repo: local
    hooks:
    -   id: no-bare-artisan-plus-literal
        name: Forbid bare 'artisan.plus' literal in plus/ or artisanlib/
        description: >-
            User-facing strings mentioning artisan.plus must route through
            plus.util.translatedServiceMessage to get the runtime brand swap
            to Cotrix. Update the source string inside the translatedServiceMessage(...)
            call to keep the literal in context, OR replace the call site with
            config.app_name in a format string.
        language: system
        entry: bash tools/check_no_bare_artisan_plus.sh
        pass_filenames: false
        always_run: true
