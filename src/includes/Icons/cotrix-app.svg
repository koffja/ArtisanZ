<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Cotrix application icon (full-bleed macOS/Windows/Linux app icon variant).
       NOTE: This is a DEDICATED app-icon source, separate from cotrix.svg which
       remains the 96x96 toolbar brand mark used by gui_theme.py.
       The tile here fills the full canvas edge-to-edge so the icon is not
       rendered undersized against neighbouring macOS app icons. -->
