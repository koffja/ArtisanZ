  <!-- Cotrix "C" mark: original 96-canvas path geometry scaled ~10.67x and recentered, stroke thickened for app-icon scale -->
  <path d="M661 338c-45-36-97-54-157-54-140 0-253 105-253 234s113 234 253 234c62 0 115-19 160-56" fill="none" stroke="#3E7179" stroke-width="86" stroke-linecap="round"/>
  <path d="M459 497c81-60 169-60 261 0" fill="none" stroke="#B46B5E" stroke-width="68" stroke-linecap="round"/>
  <path d="M459 583c81 60 169 60 261 0" fill="none" stroke="#6E8C7A" stroke-width="68" stroke-linecap="round"/>
</svg>
